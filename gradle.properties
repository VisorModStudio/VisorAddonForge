# >>> minecraft target
# Visor 0.6.0 for Minecraft >=1.21 <1.21.2, from Visor's stonecutter.properties.toml
minecraft_version=1.21.1
java_version=21
parchment_version=2024.11.17
minecraft_version_range=[1.21,1.21.1]
forge_version=52.1.16
forge_version_range=[52,)
pack_format=34
mixin_extras_version=0.4.1
visor_version=0.6.0
visor_version_range=[0.6.0,)
# <<< minecraft target
