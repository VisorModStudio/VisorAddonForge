org.gradle.jvmargs=-Xmx3G
loom.platform=forge

# ---- Mod ---------------------------------------------------------------------------------------
# Every key of this file is also a ${...} placeholder in META-INF/mods.toml and pack.mcmeta
mod_id=visor_example
mod_name=VisorExample
mod_version=1.0.0
mod_group=your.mod
mod_authors=PhoenixRa
mod_description=The Example Addon for Visor
mod_license=MIT

# ---- Minecraft target --------------------------------------------------------------------------
