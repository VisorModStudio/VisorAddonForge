pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        maven { name = "Architectury"; url = "https://maven.architectury.dev/" }
        maven { name = "Forge"; url = "https://maven.minecraftforge.net/" }
    }
}

plugins {
    // Downloads the JDK that java_version asks for when it is not installed
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "VisorAddonForge"
